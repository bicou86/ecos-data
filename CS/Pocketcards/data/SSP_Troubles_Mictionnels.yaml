# source: lines 285-300, 906-913 (points clés, pièges ECOS)
pieges:
  - "Banaliser les LUTS chez la {e:personne âgée} ('normal pour l'âge') et passer à côté de cancer, vessie neuro, ou IRA obstructive"
  - "Négliger le {t:TR} chez l'homme > 50 ans avec LUTS — il distingue HBP / cancer / prostatite et reste obligatoire avant PSA [VÉRIFIER: ordre exact TR avant ou après PSA selon protocole local]"
  - "Méconnaître le {p:syndrome de la queue de cheval} devant un LUTS aigu avec lombalgie — toujours examiner sensibilité en selle et tonus anal"
  - "Manquer un {p:cancer vessie} chez patient avec cystites récidivantes ou hématurie isolée → cystoscopie indispensable > 50 ans / tabagique"
  - "Oublier de mesurer le {t:résidu post-mictionnel} (échographie) — sous-estimation de la rétention chronique avec regorgement"


examens_complementaires:
  - "{t:TSH} SYSTÉMATIQUE (élimine {p:hypothyroïdie})"
  - "{t:FSC} + {t:ionogramme + créat} (anémie, SIADH sous ISRS), glycémie, bilan hépatique (alcool), {t:vit B12 + folates + vit D} si {e:> 65 ans}"
  - "{t:ECG} avant ISRS/tricycliques (QTc, surtout citalopram > 40 mg, escitalopram > 20 mg)"

  - "{t:PHQ-9} / {t:HAM-D} / {t:MADRS} à la baseline puis à 4-6 sem (suivi quantitatif); {t:MDQ} pour dépistage bipolarité"
  - "{t:IRM cérébrale} si début > 60 ans, signes neurologiques focaux, résistance thérapeutique, suspicion organicité [VÉRIFIER: seuil d'âge pour imagerie systématique selon recos suisses]"


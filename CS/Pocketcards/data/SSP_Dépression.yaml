pieges:
  - "Méconnaître {p:bipolaire} et prescrire un antidépresseur seul → {p:virage maniaque} (15-20 %) — TOUJOURS demander ATCD (hypo)manie et faire {t:MDQ}"
  - "Oublier d'évaluer le risque suicidaire systématiquement (RUD) — surveillance accrue à J7-15 (levée d'inhibition sous ISRS = risque accru)"

# source: line 269-279
pieges:
  - "Oublier de demander POURQUOI le patient est tombé — la chute est un symptôme, pas un diagnostic: chercher la cause (syncope, médicament, infection)"
  - "Omettre l'examen neuro-vasculaire distal comparatif → passer à côté d'une atteinte du nerf radial ou d'une ischémie aiguë"
  - "Accepter histoire incohérente avec lésions sans explorer violence domestique — entretien seule obligatoire si doute"
  - "Ne pas réaliser de CT cérébral chez un patient sous anticoagulants après TC, même si Glasgow 15 et asymptomatique"
  - "Sous-estimer un {s:raccourcissement + rotation externe MI} chez le sujet âgé comme 'simple contusion' — fracture col fémoral jusqu'à preuve du contraire"


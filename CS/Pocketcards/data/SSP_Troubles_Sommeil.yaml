criteres_hospitalisation:
  - "Idéations suicidaires actives avec plan dans contexte dépressif"
  - "Somnolence diurne mettant en danger autrui (accident professionnel ou de conduite imminent)"
  - "{p:Delirium} avec inversion nycthémérale et agitation dangereuse chez {e:personne âgée}"
  - "{p:Hyperthyroïdie} décompensée (crise aiguë thyrotoxique) avec retentissement cardiovasculaire"
  - "Sevrage BZD compliqué (crises, confusion) — sevrage en milieu hospitalier"

# source: lines 211-216 + clinical
pieges:
  - "Prescrire {r:BZD/Z-drug} d'emblée sans rechercher étiologie (SAOS, dépression, hyperthyroïdie) ni essai TCC-I — risque dépendance + masque cause"
  - "Méconnaître {p:SAOS} (ronflement + obésité + HTA + somnolence) et donner un hypnotique → {r:CPAP est le traitement}, l'hypnotique aggrave les apnées"
  - "Ne pas demander d'{t:agenda du sommeil} (sous-estimation du temps réel de sommeil — perception altérée par hyperéveil cognitif)"
  - "Maintenir un hypnotique au long cours chez {e:personne âgée} → chutes, fractures, troubles cognitifs, dépendance (déprescription progressive obligatoire)"
  - "Considérer la {p:mélatonine} comme inefficace en oubliant ses indications spécifiques (> 55 ans, troubles rythme circadien, jet lag, travail posté, RBD)"


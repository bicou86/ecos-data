# source: line 9-97
anamnese:
  socrates:
    - |-
      Site (9 quadrants):
      • épigastre (estomac, pancréas, voies biliaires)
      • HCD (foie, vésicule) / HCG (rate, queue pancréas)
      • FID (appendice, iléon, ovaire) / FIG (sigmoïde, ovaire)
      • flancs (reins) / péri-ombilical (grêle) / hypogastre (vessie, utérus)
    - |-
      Onset:
      • brutal (< 1 h → perforation, embolie, torsion) ou progressif?
      • première fois ou récidivant?
    - "Character: crampe / brûlure / torsion / coup de poignard / transfixiant (pancréas)?"
    - |-
      Radiation:
      • dos (pancréas, aorte)
      • épaule droite (vésicule, sous-phrénique)
      • organes génitaux (colique rénale)
    - |-
      Time:
      • durée : < 6 h vs > 6 h — fièvre associée?
      • aiguë (< 3 mois) vs chronique (> 3 mois)?
      • coliques (transitoires) ou constante (péritonite)?
    - |-
      Exacerbating / Relieving:
      • repas gras → vésicule; repas soulage → ulcère duodénal
      • mouvement aggrave → péritonite; position chien de fusil → pancréatite
      • miction / selles soulagent → colique néphrétique / intestinale
    - "Severity: EVA 0-10 — douleur disproportionnée à l'examen → {p:ischémie mésentérique}?"
  specifique:
    - |-
      Signes digestifs associés:
      • vomissements (alimentaire / bilieux / {s:fécaloïde} = occlusion)
      • arrêt matières ET gaz? → occlusion jusqu'à preuve contraire
      • {s:hématémèse} / {s:méléna} / rectorragies?
      • pyrosis / régurgitations
    - |-
      Signes urogénitaux:
      • brûlures mictionnelles, pollakiurie, {s:hématurie}?
      • chez la femme : DDR, {e:grossesse possible?} → bHCG SYSTÉMATIQUE
    - "Fièvre: intensité, frissons (angiocholite, cholécystite, diverticulite)?"
    - |-
      Relation repas précisée:
      • post-prandiale immédiate → gastrite
      • 2-3 h après → ulcère duodénal
      • déclenchée par repas gras → {p:colique biliaire}
  atcd:
    - |-
      Médicaux digestifs:
      • ulcère / RGO / MICI / lithiases biliaires connues
      • chirurgie abdominale antérieure → {p:brides} (occlusion)
      • cardiovasculaires : IDM / FA / artériopathie → {p:ischémie mésentérique}
    - |-
      Médicaments à risque:
      • {r:AINS / aspirine} (ulcère, perforation)
      • {r:anticoagulants} (hémorragie, hématome)
      • {r:corticoïdes} (perforation silencieuse)
    - |-
      Habitudes:
      • {e:alcool} (quantité précise — pancréatite)
      • tabac (cancer, ulcère)
      • {e:âge ≥ 50 ans} avec symptômes nouveaux → bilan néoplasique

# source: line 100-170
examen:
  general:
    - "Constantes OBLIGATOIRES: TA, FC, FR, T°, SaO₂ — chercher état de choc ({s:hypotension + tachycardie + marbrures})"
    - "Position antalgique: chien de fusil = {p:pancréatite}; immobilité absolue = {p:péritonite}"
    - "{s:Ictère} scléral / cutané → voies biliaires (angiocholite?)"
    - "Ecchymoses péri-ombilicales ({s:signe de Cullen}) / flancs ({s:Grey-Turner}) → {p:pancréatite nécrosante}"
  cible:
    - |-
      Inspection abdominale:
      • cicatrices (brides?) / distension / asymétrie
      • mouvements respiratoires (absents si {p:péritonite})
    - |-
      Auscultation EN PREMIER:
      • silence = {p:iléus / péritonite}
      • bruits métalliques = occlusion mécanique
      • normaux: 5-34/min
    - |-
      Percussion: 4 quadrants
      • tympanisme (distension gazeuse) / matité (liquide, ascite)
      • {t:pneumopéritoine}: matité pré-hépatique disparaît
    - |-
      Palpation superficielle → profonde (commencer LOIN de la zone douloureuse):
      • {s:défense} (contracture réflexe) → irritation péritonéale localisée
      • {s:contracture} (ventre de bois) → {p:péritonite} généralisée
      • {s:signe de Blumberg} (douleur décompression) → appendicite / péritonite
    - |-
      Palpations spécifiques:
      • {t:Murphy}: main sous rebord costal D + inspiration → arrêt = {p:cholécystite}
      • {t:McBurney}: 1/3 ext. ombilic-EIAS D → {p:appendicite}
      • {t:Rovsing}: palpation FIG → douleur FID = {p:appendicite}
      • {t:psoas}: extension hanche D → appendicite rétrocæcale
      • {t:Giordano}: percussion fosses lombaires → {p:pyélonéphrite}
    - |-
      Organes et orifices:
      • aorte abdominale : diamètre > 3 cm → {p:anévrisme} [VÉRIFIER: seuil diamètre aorte normal vs anévrisme]
      • orifices herniaires inguinaux et cruraux (hernie étranglée?)
      • {t:Toucher rectal}: sang, fécalome, douleur cul-de-sac Douglas
      • Examen gynécologique si indiqué

# source: line 174-190
examens_complementaires:
  - "{t:NFS + CRP}: anémie (hémorragie), {s:hyperleucocytose} (infection/inflammation)"
  - "{t:Lipase}: pancréatite si > 3N [VÉRIFIER: seuil exact lipase au CHUV/HUG — 3× LSN ou 3× la normale du labo?]; {t:bilan hépatique} (ASAT, ALAT, bilirubine, PAL, GGT)"
  - "{t:Ionogramme + créatinine + urée}: déshydratation, insuffisance rénale"
  - "{t:βHCG}: OBLIGATOIRE chez toute femme en âge de procréer [VÉRIFIER: âge limite retenu localement — certains centres jusqu'à 55 ans]"
  - "{t:Bandelette urinaire} + ECBU si positive; {t:ECG} si douleur épigastrique (IDM inférieur)"
  - |-
    Imagerie selon orientation:
    • {t:Échographie abdominale}: liquide libre, lithiases, cholécystite, appendicite
    • {t:Scanner abdomino-pelvien} avec contraste: péritonite, occlusion, pancréatite, anévrisme
    • {t:ASP debout}: pneumopéritoine (croissant sous-diaphragmatique), niveaux hydro-aériques [VÉRIFIER: place ASP vs scanner d'emblée — protocole urgences local?]

# source: line 242-287
red_flags:
  - description: "{s:Défense généralisée / contracture (ventre de bois)} ± instabilité hémodynamique"
    dx_suspecte: "{p:Péritonite / perforation viscérale}"
    action: "CT abdomino-pelvien URGENT + chirurgie viscérale en urgence + ABT IV large spectre"
  - description: "{s:Masse pulsatile péri-ombilicale} + {s:douleur dorsale} + hypotension — surtout homme > 65 ans"
    dx_suspecte: "{p:Anévrisme aortique rompu (AAA)}"
    action: "CT angio-abdominal STAT ou écho si instable → chirurgie vasculaire en urgence absolue"
  - description: "{s:Douleur abdominale disproportionnée à l'examen} pauvre + terrain vasculaire ({e:FA / coronaropathie / artériopathie})"
    dx_suspecte: "{p:Ischémie mésentérique aiguë}"
    action: "Angio-CT abdominal URGENT + chirurgie vasculaire / revascularisation"
  - description: "{e:Femme en âge de procréer} + douleur fosse iliaque + {s:métrorragies} ± malaise"
    dx_suspecte: "{p:Grossesse extra-utérine (GEU)}"
    action: "{t:βHCG} STAT + {t:échographie} pelvienne → gynécologie / chirurgie urgente si positive"
  - description: "{s:Douleur épigastrique transfixiante vers le dos} + lipase {r:> 3N} + contexte alcool / lithiase"
    dx_suspecte: "{p:Pancréatite aiguë sévère}"
    action: "Hospitalisation + {t:scanner} (score Balthazar) + réhydratation IV + antalgie; voie biliaire → CPRE"
  - description: "{s:Triade de Charcot}: fièvre + douleur HCD + {s:ictère}"
    dx_suspecte: "{p:Angiocholite}"
    action: "{r:C3G IV} (ceftriaxone {r:2 g}) + drainage biliaire urgent ({t:CPRE}) — urgence septique"

# source: line 195-228
dd_top5:
  - dx: "{p:Appendicite aiguë}"
    indices: "Migration douleur péri-ombilicale → FID, McBurney +, Blumberg +, fièvre modérée, hyperleucocytose; {t:scanner} confirme (sensibilité 94 %)"
    freq: "fréquent (incidence vie entière 7 %)"
  - dx: "{p:Cholécystite aiguë / colique biliaire}"
    indices: "HCD + Murphy + (cholécystite si fièvre + douleur > 6 h); sans fièvre + < 6 h + repas gras → colique hépatique; {t:écho}: épaississement vésiculaire, lithiase"
    freq: "fréquent (15 % adultes ont lithiase)"
  - dx: "{p:Pancréatite aiguë}"
    indices: "Épigastre transfixiant vers dos, position antalgique en chien de fusil, nausées++, contexte alcool ou lithiase; lipase > 3N confirme"
    freq: "fréquent (incidence 30-35/100 000/an)"
  - dx: "{p:Occlusion intestinale}"
    indices: "Arrêt COMPLET matières ET gaz, vomissements (fécaloïdes si bas), distension, bruits métalliques ou silence; ATCD chirurgie abdominale ({p:brides}); ASP: niveaux hydro-aériques"
    freq: "fréquent en chirurgie (brides = cause principale adulte)"
  - dx: "{p:Ischémie mésentérique}"
    indices: "Douleur diffuse intense disproportionnée + examen pauvre au début; terrain vasculaire (FA, artériopathie); douleur postprandiale précoce (mésentérique chronique); angio-CT confirme"
    freq: "rare mais mortalité > 50 % si retard"

pec_initiale:
  immediate:
    - "STOP red flags d'abord — tout signe chirurgical → CT abdomino-pelvien avant antalgiques; voie veineuse + bilan biologique simultané"
    - "Antalgie: {r:paracétamol 1 g IV} ou PO; {r:morphine titrée IV} si douleur sévère après évaluation initiale — ne pas retarder l'antalgie pour le diagnostic"
    - "Mise à jeun si chirurgie probable; {r:réhydratation IV NaCl 0,9 %} si déshydratation/choc"
    - |-
      Urgences chirurgicales:
      • {p:péritonite/perforation} → antibiotiques IV + chirurgie urgente
      • {p:appendicite} → appendicectomie cœlioscopique + ATB péri-opératoire
      • {p:cholécystite} → {r:amoxicilline-clavulanate IV} + cholécystectomie précoce
    - |-
      Urgences médicales:
      • {p:pancréatite} → hospitalisation, {r:réhydratation intensive}, antalgie, mise à jeun; si biliaire → CPRE
      • {p:angiocholite} → {r:ceftriaxone 2 g IV} + drainage biliaire urgent
      • {p:occlusion} → aspiration nasogastrique + chirurgie si strangulation
  orientation:
    - "Domicile + suivi rapide: douleur légère-modérée, bilan normal, pas de red flag (ex: gastrite, colique hépatique simple)"
    - "Urgences: tout red flag, douleur sévère EVA ≥ 7, instabilité hémodynamique, vomissements incoercibles, fièvre ≥ 38,5 °C"
    - "Hospitalisation: péritonite, pancréatite, occlusion, angiocholite, GEU, AAA, ischémie mésentérique"
    - "Consignes de retour: aggravation brutale, fièvre, arrêt matières/gaz, malaise"

criteres_hospitalisation:
  - "Tout signe de péritonite / choc hémodynamique"
  - "{p:Pancréatite aiguë} confirmée (lipase > 3N) — toute forme [VÉRIFIER: protocole local CHUV/HUG stratification légère vs sévère — Ranson/BISAP nécessaire d'emblée?]"
  - "{p:Occlusion intestinale} complète ou signes de strangulation"
  - "{p:GEU} ou autre urgence gynécologique"
  - "Douleur non contrôlée, vomissements incoercibles, déshydratation sévère"

pieges:
  - "Oublier la {p:GEU} chez toute femme en âge de procréer → bHCG AVANT toute imagerie; une GEU peut mimer une appendicite"
  - "Méconnaître l'{p:IDM inférieur} qui se présente comme épigastralgie — toujours ECG si terrain CV et douleur épigastrique"
  - "Banaliser la douleur chez le sujet âgé: présentation atypique (pas de fièvre, défense discrète), mortalité chirurgicale plus élevée — seuil bas pour CT"
  - "La {p:péritonite} peut débuter localisée (Murphy, McBurney) avant généralisation — réévaluer systématiquement; corticoïdes peuvent masquer les signes"
  - "L'{p:ischémie mésentérique} est sous-diagnostiquée: douleur atroce + examen pauvre = signe d'alarme, surtout chez patient avec FA ou artériopathie"

cartes_liees:

pieges:
  - "Prescrire ATB sans {t:TDR} (80 % angines virales) — antibiorésistance + effets indésirables inutiles"
  - "Donner {r:amoxicilline} en cas de {p:MNI} (suspectée si asthénie + ADP postérieures + splénomégalie) — rash dans 90 % des cas, non allergique mais alarmant"
  - "Méconnaître un {p:phlegmon} (trismus + voix 'pomme chaude' + déviation luette) — examiner SYSTÉMATIQUEMENT la luette et tester l'ouverture buccale"
  - "Examiner activement la gorge en cas de suspicion d'{p:épiglottite} (stridor + hypersialorrhée) — risque d'arrêt respiratoire; appeler ORL/anesthésie en bloc"
  - "Oublier de tracer un strepto non traité chez l'enfant — risque de {p:RAA} / {p:GNA} à 1-3 sem (rechercher arthralgies, œdèmes, protéinurie au contrôle)"


anamnese_appareil:
  # Symptômes cardinaux
  - |-
    {s:Syndrome anémique}:
    • {s:asthénie}/fatigue (installation aiguë vs progressive, retentissement quotidien)
    • {s:dyspnée d'effort} (classe, distance de marche)
    • palpitations, douleur thoracique (angor d'anémie chez coronarien)
    • céphalées, vertiges, acouphènes, lipothymie
    • pâleur signalée par l'entourage
    • pica (géophagie, pagophagie → carence martiale)
    • tolérance dépend de la vitesse d'installation
  - |-
    {s:Syndrome hémorragique}:
    • type: cutané ({s:pétéchies}, {s:ecchymoses} spontanées) vs muqueux (épistaxis, gingivorragies, ménorragies) vs profond (hémarthrose, hématome musculaire)
    • spontané ou provoqué (chirurgie, dentaire, post-partum)
    • caractère: hématomes superficiels diffus → trouble plaquettaire; saignements profonds/différés → trouble de la coagulation
    • durée du saignement, besoin transfusionnel
    • prise d'{r:antiplaquettaires/anticoagulants}, AINS
  - |-
    {s:Syndrome thrombotique}:
    • {p:TVP} (œdème unilatéral, douleur du mollet) / {p:EP} (dyspnée brutale, douleur pleurétique)
    • thromboses de site inhabituel (veines splanchniques, cérébrales → SMP, HPN)
    • caractère provoqué (chirurgie, immobilisation, cancer, œstroprogestatifs, grossesse) vs non provoqué
    • récidive, ATCD familiaux de thrombose précoce (thrombophilie)
    • fausses couches répétées ({p:SAPL})
  - |-
    {s:Syndrome tumoral / infiltratif}:
    • {s:adénopathies} perçues par le patient (cou, aisselle, aine) — délai d'apparition, croissance
    • masse/pesanteur de l'hypochondre gauche ({s:splénomégalie}), satiété précoce
    • douleurs osseuses (myélome, infiltration médullaire)
    • masse abdominale
  - |-
    {s:Signes B} (lymphomes, syndromes lymphoprolifératifs):
    • {s:fièvre} > 38 °C inexpliquée et persistante
    • {s:sueurs nocturnes} profuses (changement de pyjama)
    • {s:perte de poids} > 10 % du poids en 6 mois
    • prurit, douleur ganglionnaire à l'alcool (Hodgkin)
  - |-
    {s:Syndrome infectieux / déficit immunitaire}:
    • infections à répétition, sévères ou opportunistes (neutropénie, lymphome, myélome)
    • fièvre chez patient {e:neutropénique} = URGENCE
    • aphtes, angines récidivantes
  # Facteurs de risque / contexte / ATCD
  - |-
    Facteurs de risque & expositions:
    • carences alimentaires (régime végétalien → B12; grossesse/allaitement → fer/folates)
    • saignements chroniques (digestif, gynécologique)
    • toxiques: alcool (macrocytose, toxicité médullaire), benzène, radiations, chimiothérapie antérieure
    • voyage / origine (paludisme, hémoglobinopathies en zone méditerranéenne/africaine/asiatique)
  - |-
    ATCD personnels pertinents:
    • {p:hémopathie} connue, {p:cancer} solide, irradiation/chimiothérapie
    • maladie auto-immune (LED → cytopénies auto-immunes)
    • maladie inflammatoire chronique, insuffisance rénale (anémie inflammatoire/rénale)
    • splénectomie (risque infectieux à germes encapsulés), gastrectomie/bypass (malabsorption B12/fer)
    • transfusions antérieures, allo-immunisation
  - |-
    ATCD familiaux:
    • {p:hémoglobinopathies} (drépanocytose, thalassémie)
    • hémophilie / maladie de Willebrand
    • {p:thrombophilie} héréditaire (facteur V Leiden, déficit AT/PC/PS)
    • hémochromatose, sphérocytose héréditaire, hémopathies malignes
  - |-
    Traitements en cours (à systématiser):
    • {r:anticoagulants (AVK, DOAC, héparine)}, {r:antiplaquettaires}
    • médicaments myélotoxiques / inducteurs de cytopénie (chimiothérapie, méthotrexate, certains antibiotiques)
    • supplémentation (fer, B12, folates, EPO)
    • corticoïdes/immunosuppresseurs
    • œstroprogestatifs (risque thrombotique)
  - "Mode de vie: alimentation (apports en fer/B12/folates), alcool (UI/semaine), tabac, profession (exposition benzène/solvants), activité sportive (hémolyse de marche)"

examen_physique:
  "Aires ganglionnaires":
    - "Méthode: palpation bilatérale et comparative, pulpe des 2e-3e-4e doigts, mouvements circulaires doux; patient détendu, muscles relâchés; examiner systématiquement toutes les aires pour ne pas en oublier; toujours comparer droite/gauche"
    - "Aires CERVICALES (ordre systématique): sous-mentonnières, sous-maxillaires, jugulo-carotidiennes (chaîne jugulaire interne), spinales (bord postérieur du SCM), sus-claviculaires; {s:ganglion de Troisier} (sus-claviculaire gauche, à la jonction du canal thoracique) → néoplasie digestive/pelvienne ou {p:lymphome}; occipitales et pré/rétro-auriculaires"
    - "Aires AXILLAIRES: soutenir le bras du patient (relâchement du pli), explorer les 5 groupes (central, pectoral/antérieur, sous-scapulaire/postérieur, latéral/huméral, apical); patient assis bras semi-fléchi"
    - "Aires INGUINALES: chaîne horizontale (sous l'arcade crurale) et chaîne verticale (le long de la veine saphène); des ganglions inguinaux petits (< 1 cm), roulants et indolores sont fréquents et banals; rechercher aussi épitrochléens (face interne du coude, sus-épicondyliens → infection main/lymphome)"
    - |-
      Caractériser chaque {s:adénopathie} (6 critères):
      • taille (pathologique si > 1 cm, > 1,5 cm en inguinal)
      • consistance (molle = inflammatoire; ferme/élastique = lymphome; dure pierreuse = métastase)
      • sensibilité (douloureux = inflammatoire/infectieux; indolore = néoplasique)
      • mobilité (mobile = bénin; fixé aux plans profonds/peau = malin)
      • caractère isolé vs polyadénopathie, uni- vs bilatéral
      • signes inflammatoires locaux (rougeur, chaleur, fistulisation)
    - "Orientation: adénopathie localisée → chercher la porte d'entrée dans le territoire de drainage (infection, plaie, néoplasie locorégionale); polyadénopathie + {s:splénomégalie} → syndrome lymphoprolifératif, infection systémique (EBV, CMV, VIH, toxoplasmose), connectivite"
  "Inspection (pâleur, purpura)":
    - "Coloration cutanéo-muqueuse: rechercher la {s:pâleur} surtout aux muqueuses (conjonctives palpébrales inférieures déplissées, muqueuse buccale, lit unguéal, paume des mains) car la peau est trompeuse; pâleur conjonctivale → anémie probable (Hb basse), bonne valeur d'orientation"
    - "{s:Ictère}: coloration jaune des sclères (subictère) puis de la peau → hémolyse (ictère à bilirubine non conjuguée), associé à pâleur = anémie hémolytique; chercher urines foncées"
    - |-
      {s:Purpura} (ne s'efface PAS à la vitropression — distingue de l'érythème):
      • {s:pétéchies} (< 3 mm, ponctiformes) → thrombopénie, thrombopathie, vascularite
      • {s:ecchymoses}/{s:vibices} (placards) → trouble de l'hémostase, fragilité capillaire
      • purpura pétéchial déclive (chevilles, jambes) → thrombopénique; purpura infiltré/palpable → vascularite
      • distinguer purpura plaquettaire (cutanéo-muqueux, spontané) du purpura sénile/cortisonique (dos des mains/avant-bras, mécanique)
    - "Signes de saignement actif: {s:gingivorragies}, bulles hémorragiques endo-buccales (thrombopénie sévère), épistaxis, hémorragies sous-conjonctivales; fond d'œil (hémorragies rétiniennes en cas de thrombopénie profonde / hyperviscosité)"
    - "Phanères et téguments: koïlonychie (ongles en cuillère → carence martiale), perlèche/chéilite angulaire et glossite (langue dépapillée, lisse → carence fer/B12/folates), peau et cheveux secs/cassants; télangiectasies cutanéo-muqueuses (maladie de Rendu-Osler)"
    - "Signes orientant l'étiologie: troubles neurologiques (sclérose combinée de la moelle → {p:carence en B12}: ataxie, paresthésies), hippocratisme digital (hypoxie chronique), faciès (thalassémie majeure: hypertrophie des os de la face)"
  "Splénomégalie & Hépatomégalie":
    - |-
      {r:Palpation de la rate} — patient en décubitus dorsal puis en décubitus latéral droit (position de Schuster, pour rapprocher la rate de la paroi):
      • examinateur à droite, main gauche soulevant le grill costal gauche postérieur
      • main droite à plat débutant dans la fosse iliaque droite (la rate s'agrandit vers le bas et en dedans, vers la FID)
      • remonter en oblique vers l'hypochondre gauche en demandant une inspiration profonde
      • le pôle inférieur splénique vient buter sous les doigts à l'inspiration
    - |-
      Caractères d'une {s:splénomégalie} (rate normalement non palpable):
      • bord antérieur crénelé (encoche splénique caractéristique)
      • mobile avec la respiration, descend à l'inspiration
      • on ne peut PAS passer la main entre la rate et le rebord costal (contrairement au rein)
      • matité splénique à la percussion (espace de Traube comblé: 9e-11e EIC gauche, ligne axillaire antérieure)
      • mesurer le débord sous le rebord costal en cm
    - "Étiologies de splénomégalie selon le contexte: infectieuse (EBV, endocardite, paludisme, VIH), hématologique ({p:syndromes myéloprolifératifs} dont LMC = grosse rate, {p:lymphome}, LLC, leucémie aiguë, anémies hémolytiques), hypertension portale (cirrhose), surcharge/infiltration; énorme splénomégalie → LMC, myélofibrose, leishmaniose, thalassémie"
    - |-
      {r:Palpation du foie / Hépatomégalie}:
      • main droite à plat, doigts parallèles au rebord costal droit, débuter en fosse iliaque droite
      • remonter à chaque inspiration jusqu'à sentir le bord inférieur du foie buter
      • caractériser: flèche hépatique (percussion sur ligne médio-claviculaire, normale 10-12 cm), bord (tranchant/mousse), consistance, surface (lisse/nodulaire), sensibilité, caractère pulsatile
      • {s:hépato-splénomégalie} associée à des adénopathies → fortement évocatrice d'un syndrome lymphoprolifératif/hémopathie
    - "Distinguer rate vs rein gauche: la rate descend à l'inspiration, a une encoche, est mate à la percussion et n'est pas ballottable; le rein est ballottable (contact lombaire bimanuel) et reste sonore (interposition colique)"
  "Signes associés":
    - "Signes d'{s:hémolyse}: pâleur + {s:ictère} conjonctival + splénomégalie ± urines foncées; rechercher ulcères de jambe malléolaires (drépanocytose, sphérocytose), lithiase biliaire pigmentaire"
    - "Signes d'{s:hyperviscosité} (myélome, Waldenström, polyglobulie, leucostase): troubles visuels, céphalées, vertiges, somnolence, saignements muqueux, fond d'œil (veines dilatées tortueuses, hémorragies); érythrose faciale et prurit à l'eau dans la {p:polyglobulie de Vaquez}"
    - "Signes de {p:thrombose}: TVP (mollet chaud, douloureux, œdème unilatéral, signe de Homans, ballant du mollet diminué, lacet veineux); phlébite superficielle (cordon induré); recherche systématique en cas de SMP ou de néoplasie"
    - "Signes osseux et localisations spécifiques: douleur à la pression du sternum/des os longs (infiltration médullaire), hypertrophie gingivale (leucémie monoblastique LAM4/5), atteinte cutanée (leucémides, localisations de lymphome cutané)"
    - "Examen général orientant: température (état fébrile, {e:neutropénie fébrile}), signes de carence (langue, peau), état hémodynamique (tachycardie, hypotension → anémie aiguë/hémorragie), examen ORL et dentaire (porte d'entrée infectieuse chez le neutropénique)"
    - "Toucher rectal et examen des selles si suspicion de saignement digestif occulte (étiologie d'une anémie ferriprive chez l'adulte → toujours rechercher un cancer colorectal)"

manoeuvres:
  - "{r:Recherche de pâleur conjonctivale}: déplisser la paupière inférieure et inspecter la conjonctive palpébrale en bonne lumière; POSITIF si pâleur (perte de la coloration rosée) → bonne valeur d'orientation pour une anémie (Hb basse); compléter par lit unguéal et pli palmaire"
  - "{r:Vitropression (diascopie)}: appuyer une lame de verre (ou presser la peau) sur la lésion rouge; POSITIF (lésion S'EFFACE) = érythème vasculaire (vasodilatation); NÉGATIF (lésion NE s'efface PAS) = {s:purpura} (extravasation sanguine) → orienter vers thrombopénie/thrombopathie/vascularite"
  - "{r:Test du lacet / signe de Rumpel-Leede} (fragilité capillaire): gonfler un brassard à mi-chemin entre PAS et PAD pendant 5 min, puis compter les pétéchies dans un cercle de 5 cm au pli du coude; POSITIF si > 10-20 pétéchies → fragilité capillaire / thrombopénie / thrombopathie (test peu utilisé, faible spécificité)"
  - "{r:Palpation de la rate en décubitus latéral droit (Schuster)}: si la rate n'est pas perçue en décubitus dorsal, tourner le patient sur le côté droit, hanches/genoux fléchis; la rate bascule en avant et devient palpable; permet de détecter une splénomégalie modérée"
  - "{r:Percussion de l'espace de Traube}: percuter la région du 9e-11e EIC gauche entre la ligne axillaire antérieure et le rebord costal; NORMAL = tympanisme (estomac/côlon aérés); ANORMAL = matité → suspecter une {s:splénomégalie} (faire percuter après un repas peut donner un faux positif)"
  - "{r:Signe de Castell}: percuter le dernier espace intercostal gauche sur la ligne axillaire antérieure en expiration puis en inspiration profonde; POSITIF si passage du tympanisme (expiration) à la matité (inspiration) → splénomégalie (sensibilité supérieure à Traube)"
  - "{r:Manœuvre du ballottement rénal}: main postérieure dans la fosse lombaire qui propulse vers l'avant, main antérieure qui perçoit le contact; POSITIVE pour le rein (ballottable, contact lombaire) → permet de distinguer un gros rein gauche d'une splénomégalie (rate non ballottable, avec encoche)"
  - "{r:Recherche de signes méningés / neuro en cas de carence B12}: tester la sensibilité profonde (sens de position, diapason), la marche talon-pointe, le signe de Romberg et les réflexes; atteinte cordonale postérieure → sclérose combinée de la moelle ({p:carence en vitamine B12})"
  - "{r:Examen de TVP au lit du malade}: mesurer la circonférence des deux mollets (différence > 3 cm significative), rechercher chaleur/rougeur/œdème/douleur le long du trajet veineux profond, dilatation des veines superficielles; intégrer dans le {t:score de Wells} (l'examen seul est insuffisant → échographie doppler)"

echelles:
  - |-
    {t:Score de Wells — TVP} (probabilité clinique de thrombose veineuse profonde):
    • cancer actif (+1), paralysie/plâtre d'un MI (+1), alitement > 3 j / chirurgie majeure < 12 sem (+1)
    • douleur sur le trajet veineux profond (+1), œdème de tout le membre (+1), mollet > 3 cm controlatéral (+1)
    • œdème prenant le godet du côté symptomatique (+1), veines collatérales superficielles (+1), ATCD de TVP (+1)
    • diagnostic alternatif au moins aussi probable (−2)
    • ≤ 1 = TVP peu probable (D-dimères); ≥ 2 = TVP probable (échographie doppler)
  - |-
    {t:Score de Wells — Embolie pulmonaire}:
    • signes cliniques de TVP (+3), EP plus probable qu'un autre diagnostic (+3)
    • FC > 100/min (+1,5), immobilisation/chirurgie < 4 sem (+1,5), ATCD de TVP/EP (+1,5)
    • hémoptysie (+1), cancer actif (+1)
    • < 2 = faible, 2-6 = intermédiaire, > 6 = forte; ≤ 4 = EP improbable → D-dimères (ou critères {t:PERC})
  - |-
    {t:Score HAS-BLED} — Risque hémorragique sous {r:anticoagulation}:
    • HTA non contrôlée, anomalie rénale/hépatique (1 chacun), AVC, saignement antérieur
    • INR labile, âge > 65 ans, médicaments (antiplaquettaires/AINS) ou alcool
    • SCORE ≥ 3 = haut risque hémorragique (surveillance renforcée, ne contre-indique pas l'anticoagulation)
  - |-
    {t:Score IPSS-R} (myélodysplasies) / {t:DIPSS} (myélofibrose):
    • scores pronostiques intégrant cytopénies, blastes médullaires et caryotype/mutations
    • orientent l'intensité thérapeutique (surveillance vs allogreffe)
  - |-
    {t:Classification d'Ann Arbor} — Stadification des {p:lymphomes}:
    • I = une seule aire ganglionnaire; II = ≥ 2 aires du même côté du diaphragme
    • III = aires des deux côtés du diaphragme; IV = atteinte extra-ganglionnaire diffuse (moelle, foie)
    • suffixe A = absence de {s:signes B}; B = présence de signes B (fièvre, sueurs nocturnes, amaigrissement > 10 %)
  - "{t:Échelle ECOG / performance status}: 0 = activité normale; 1 = symptômes mais ambulatoire; 2 = alité < 50 % du temps; 3 = alité > 50 %; 4 = grabataire; oriente la tolérance aux traitements en oncohématologie"


anamnese_appareil:
  # Symptômes cardinaux
  - "Douleur thoracique: siège (rétrosternal, latéral, pleurétique?), irradiation (bras gauche, mâchoire, dos), caractère (oppressive/brûlure/déchirure/pleurétique), durée, facteurs déclenchants (effort, repos, décubitus), facteurs soulageants (nitrates, position penchée en avant?), association dyspnée/sueurs/nausées — score 0-10"
  - "Dyspnée: installation (aiguë vs progressive), classe NYHA (I = effort intense seulement, II = effort modéré, III = effort minime, IV = repos), orthopnée (nombre d'oreillers), dyspnée paroxystique nocturne, position penchée en avant (péricardite), aggravée au décubitus?"
  - "Palpitations: début/fin brutal ou progressif, régulières ou irrégulières, rapidité, début et fin précis (suggestif de réentrée), facteurs déclenchants (café, alcool, stress, effort), durée, association lipothymie/syncope/douleur thoracique/dyspnée"
  - "Syncope/lipothymie: prodromes (nausées, sudation, vision trouble), circonstance (debout prolongé, effort, position, miction, toux, émotion), récupération (durée, confusion post-critique absente = syncope), morsure de langue, incontinence"
  - "Œdèmes MI: bilatéraux (IC droite, insuffisance rénale, hypoalbuminémie) ou unilatéral (TVP, insuffisance veineuse chronique), aggravation vespérale, signe du godet, progression (chevilles → jambes → lombes)"
  - "Claudication intermittente: douleur au mollet à l'effort (distance de marche en mètres), soulagée au repos (< 10 min), facteurs de risque cardiovasculaires (tabac, diabète, HTA, dyslipidémie)"
  # Facteurs de risque cardiovasculaires (à systématiser)
  - "FRCV: tabac (paquets-années, arrêt?), HTA (connue, traitée, mesures à domicile?), diabète (type, HbA1c, complications?), dyslipidémie (LDL, traitement?), obésité (IMC), sédentarité, stress chronique"
  - "ATCD cardiovasculaires personnels: SCA/IDM (date, coronarographie, stents?), IC (FE connue?), FA/flutter, valvulopathie, AVC/AIT, AOMI, MTEV (TVP/EP)"
  - "ATCD familiaux: maladie coronarienne précoce (H < 55 ans, F < 65 ans), mort subite inexpliquée, cardiomyopathie, channelopathie (QT long, Brugada), syndrome de Marfan"
  - "Traitements en cours: aspirine, anticoagulants (DOAC, AVK — indication, INR?), bêtabloquants, IEC/ARA/ARNI, diurétiques, statines, antiarythmiques, médicaments allongeant le QT"
  - "Mode de vie: alcool (UI/semaine), activité physique (type, fréquence, capacité actuelle), régime alimentaire (sel, graisses saturées)"

examen_physique:
  inspection:
    - "État général: conscience et agitation (Glasgow si altéré), position antalgique (penché en avant → péricardite; recroquevillé → douleur coronarienne), état nutritionnel (cachexie cardiaque: amyotrophie temporale/interdigitale)"
    - "Peau et phanères: pâleur (anémie, choc), cyanose centrale (lèvres, langue — shunt D→G, hypoxémie) vs périphérique (extrémités froides — bas débit), marbrures/livedo (hypoperfusion, sepsis), teint gris (choc cardiogénique)"
    - "Signes d'endocardite: lésions de Janeway (érythème indolore paumes/plantes), nodules d'Osler (pulpe des doigts, douloureux), pétéchies sous-unguéales (hémorragies en flammèche), taches de Roth (fond d'œil)"
    - "Signes dyslipidémiques: xanthélasmas (paupières), gérontoxon (arc cornéen < 50 ans = pathologique), xanthomes tendineux (tendons d'Achille, extenseurs doigts)"
    - "Thorax: cicatrice médiane (sternotomie), cicatrices latérales (thoracotomie, drain), boîtier pacemaker/DAI (sous-claviculaire), déformations thoraciques (pectus excavatum → prolapsus mitral, syndrome de Marfan)"
    - "Veines jugulaires (patient à 30-45°, tête tournée légèrement): turgescence jugulaire (distension > 3-4 cm au-dessus de l'angle sternal = PVC élevée → IC droite, épanchement péricardique, HTAP); signe de Kussmaul (augmentation inspiratoire → péricardite constrictive, cardiomyopathie restrictive)"
    - "Membres inférieurs: œdème bilatéral (signe du godet: appui 30 sec sur tibia/malléole — coter +/+++ selon profondeur), varices, dermite ocre, atrophie blanche (insuffisance veineuse chronique), ulcère veineux (sus-malléolaire, suintant) vs artériel (sec, nécrotique, douloureux)"
    - "Membres inférieurs: gradient thermique (pied froid jusqu'à quel niveau → artériopathie oblitérante), décoloration (pâleur surélevé → rubiconde déclive = insuffisance artérielle), perte de pilosité distale, troubles trophiques"
  palpation:
    - "Pouls radial (1 min si irrégulier, sinon 15 sec × 4): fréquence (tachycardie > 100, bradycardie < 60), rythme (régulier / irrégulièrement irrégulier = FA / régulièrement irrégulier = ESV, bloc), amplitude (bondissant = IA, filant = IC/hypovolémie), comparaison bilatérale"
    - "Pression artérielle: brassard adapté (2/3 circonférence du bras), déflation 2 mmHg/sec, bruits de Korotkoff, 3 mesures à 1 min d'intervalle (moyenner les 2 dernières), les deux bras (asymétrie > 10 mmHg → dissection aortique, coarctation, AOMI sous-clavière); test orthostatique si syncope/hypotension"
    - "Pouls carotidien (un côté à la fois, jamais simultané): amplitude, retard (parvus et tardus → RA serré), auscultation souffles carotidiens avant la palpation"
    - "Choc de pointe (apexien): main en regard du 4e-5e EIC gauche, affiner à la pulpe des doigts; normal: 4e-5e EIC, ligne médio-claviculaire, diamètre < 2,5 cm, bref; déplacé latéralement/bas → dilatation VG; amplifié et soutenu → hypertrophie VG (HTA, RA); impalpable → épanchement péricardique, BPCO, obésité"
    - "Frémissements: main à plat sur les foyers; frémissement systolique au foyer aortique → RA serré; à l'apex → IM sévère; diastolique = rare (RM serré)"
    - "Reflux hépato-jugulaire: patient à 30-45°, compression ferme et soutenue de l'hypochondre droit (10 sec), observer la veine jugulaire interne droite; positif si distension > 3 cm pendant compression → dysfonction VD, IC congestive"
    - "Pouls périphériques (comparer bilatéralement, coter 0 à 3+): fémoral (arc crural mi-inguinal), poplité (empoigner genou en décubitus dorsal), tibial postérieur (bord interne de la malléole interne), pédieux (dos du pied entre 1er et 2e métatarsiens — absent physiologiquement dans 8 %)"
    - "Signe de Homans (dorsiflexion passive du pied genou tendu) et palpation du mollet: douleur → TVP (faible sensibilité/spécificité; ne pas s'y fier seul); induration en cordon du trajet veineux superficiel → thrombose veineuse superficielle"
    - "Abdomen: hépatomégalie (foie cardiaque = bord inférieur > 2 travers de doigt sous rebord costal, douloureux = congestion aiguë); ascite (matité des flancs déclive, fluctuation); rate (splénomégalie = embolie septique d'endocardite)"
  percussion:
    - "Aire cardiaque: peu pratiquée en routine (écho > percussion); matité cardiaque élargie → cardiomégalie, épanchement péricardique (matité qui suit la position)"
    - "Bases pulmonaires: matité bilatérale déclive symétrique → épanchements pleuraux réactionnels (IC gauche); asymétrie → suspecter autre cause"
  auscultation:
    - "Foyers et ordre systématique (mémo 'All People Try MacDonald' = Aortique → Pulmonaire → Tricuspide → Mitral): examinateur à droite du patient, stéthoscope réchauffé, patient torse nu, environnement calme, associer palpation simultanée du pouls carotidien pour repérer la systole"
    - "Foyer AORTIQUE (A): 2e espace intercostal (EIC), bord droit du sternum. Membrane. Sténose aortique: souffle mésosystolique crescendo-decrescendo rude, irradiation aux carotides, B2 diminué/absent, pouls parvus et tardus. Insuffisance aortique: souffle proto-diastolique decrescendo doux/aspiratif, mieux entendu en position penchée en avant en expiration"
    - "Foyer PULMONAIRE (P): 2e EIC, bord gauche du sternum. Membrane. Sténose pulmonaire: souffle mésosystolique, B2 dédoublé. Insuffisance pulmonaire (Graham-Steell): souffle proto-diastolique doux (HTAP). Rechercher dédoublement B2: physiologique en inspiration; fixe → CIA; paradoxal → BBG/RA"
    - "Foyer TRICUSPIDE (T): 4e EIC, bord gauche du sternum. Membrane puis cloche. Insuffisance tricuspide: souffle pansystolique doux, augmente à l'inspiration (signe de Carvallo). Sténose tricuspide: roulement diastolique rare, augmente à l'inspiration"
    - "Foyer MITRAL (M): 5e EIC, ligne médio-claviculaire (apex). Cloche pour B3/B4 et rétrécissement mitral, membrane pour insuffisance mitrale. Insuffisance mitrale: souffle pansystolique en jet de vapeur, irradiation vers l'aisselle, B1 diminué. Rétrécissement mitral: roulement diastolique grave post-claquement d'ouverture, B1 accentué et claquant"
    - "Point d'ERB: 3e EIC, bord gauche du sternum. Zone de rayonnement de plusieurs souffles; insuffisance aortique souvent mieux perçue ici qu'au foyer aortique. Utiliser cloche et membrane"
    - "Bruits normaux et additionnels: B1 (fermeture valves AV, début systole, maximal à l'apex, long/grave); B2 (fermeture valves sigmoides, début diastole, maximal à la base, bref/aigu); B3 proto-diastolique (galop ventriculaire — cloche, DLG): pathologique > 40 ans → IC systolique, surcharge volume; B4 télé-diastolique (galop atrial — cloche): HTA, RA, cardiomyopathie hypertrophique"
    - "Frottement péricardique: bruit de cuir neuf, va-et-vient systolo-diastolique, localisé au bord sternal gauche, sans irradiation, PERSISTE EN APNÉE (distingue du frottement pleural), s'entend mieux en position penché en avant en expiration → péricardite aiguë"
    - "Souffles: caractériser systématiquement (6 critères): (1) siège et foyer d'intensité maximale, (2) irradiation, (3) timing (systolique/diastolique/continu), (4) intensité (1/6 = inaudible sans appui; 2/6 = doux; 3/6 = modéré; 4/6 = frémissement; 5/6 = très fort; 6/6 = audible sans stéthoscope), (5) timbre (rude/soufflant/roulant/musical), (6) forme (croissant-décroissant/plateau/crescendo)"
    - "Poumons (toujours ausculter en cardio): crépitants fins bilatéraux des bases (oedème pulmonaire → IC gauche); épanchement pleural (diminution MV + matité + égophonie); sibilances (bronchospasme = asthme cardiaque dans l'IC gauche aiguë)"
    - "Souffles vasculaires: artères carotides (souffle systolique → sténose carotidienne, irradiation RA), artère abdominale (épigastre → anévrisme aortique, sténose artère rénale), artères rénales (flancs → HTA rénovasculaire), artères fémorales (inguinal → AOMI)"

manoeuvres:
  - "Reflux hépato-jugulaire (RHJ): patient à 30-45°, tête légèrement tournée à gauche, compression ferme hypochondre droit 10 secondes; POSITIF si augmentation de la pression veineuse jugulaire > 3 cm pendant > 10 sec; valeur prédictive positive élevée pour insuffisance cardiaque droite et pression capillaire pulmonaire > 15 mmHg"
  - "Test orthostatique (hypotension orthostatique): mesure PA couché après 5 min de repos, puis debout à 1 min et 3 min; POSITIF si chute systolique ≥ 20 mmHg ou diastolique ≥ 10 mmHg; causes: déshydratation, médicaments (diurétiques, nitrates, bêtabloquants, antihypertenseurs), neuropathie autonomique (diabète), insuffisance surrénalienne"
  - "Décubitus latéral gauche (DLG) pour le foyer mitral: patient en DLG, stéthoscope à la pointe (5e EIC, MCG); AMPLIFIE: souffle d'insuffisance mitrale, rétrécissement mitral, B3 et B4 gauches; manœuvre de référence pour valvulopathies mitrales gauches"
  - "Position assise penché en avant en expiration (insuffisance aortique): patient assis, penché à 45° en avant, expiration forcée et maintenue; AMPLIFIE: souffle proto-diastolique de l'insuffisance aortique et souffles à composante diastolique gauche; AMPLIFIE aussi: frottement péricardique"
  - "Manœuvre de Valsalva (phase II → III): patient inspire profondément, bloque et pousse 10-15 sec; PHASE II (effort): diminue retour veineux et souffles (sauf CMH et prolapsus mitral); PHASE III (relâchement): augmentation brutale. CMH obstructive: souffle augmente à la phase II (moins de remplissage VG → plus d'obstruction). Prolapsus mitral: clic se rapproche de B1 en Valsalva (VG moins rempli → valve prolabe plus tôt)"
  - "Accroupissement (manœuvre antagoniste au Valsalva): depuis position debout → accroupi; augmente retour veineux et résistances périphériques → VG plus rempli → DIMINUE souffle CMH obstructive et RETARDE le clic du prolapsus mitral (clic s'éloigne de B1). Inverse: debout depuis accroupi → AUGMENTE souffle CMH"
  - "Inspiration profonde (manœuvre de Rivero-Carvallo pour les souffles droits): inspiration profonde → augmente retour veineux VD → augmente tous les souffles droits (IT, ST, IP) et dédoublement B2; POSITIF: souffle augmente à l'inspiration → origine droite (tricuspide ou pulmonaire)"
  - "Handgrip (isométrique): serrer fortement la main de l'examinateur pendant 20-30 sec; augmente les résistances périphériques (postcharge VG); AUGMENTE: insuffisances mitrales et aortiques (régurgitations); DIMINUE: CMH obstructive et sténose aortique (sténoses)"
  - "Palpation du choc de pointe en DLG: si le choc de pointe est difficile à repérer en décubitus dorsal, placer le patient en DLG (le cœur se rapproche de la paroi); permet de localiser l'apex et de rechercher un choc de pointe étalé/soutenu (surcharge pression VG) ou dévié (dilatation)"
  - "Signe de Kussmaul: observer les veines jugulaires pendant une inspiration profonde; NORMAL: les jugulaires se vident (inspiration → diminution PVC); ANORMAL (Kussmaul positif): augmentation paradoxale de la distension jugulaire à l'inspiration → péricardite constrictive, cardiomyopathie restrictive, IC droite sévère, tamponnade"

echelles:
  - "NYHA (New York Heart Association) — Classification fonctionnelle de l'IC: I = aucune limitation (effort intense seulement) | II = légère limitation (effort modéré: montée > 2 étages) | III = limitation importante (effort minime: marche à plat < 100 m) | IV = symptômes au repos ou tout effort; évaluer à chaque consultation pour guider le traitement"
  - "CHA2DS2-VASc — Risque thrombo-embolique dans la FA: C=IC ou FEVG<40% (+1), H=HTA (+1), A2=âge≥75ans (+2), D=diabète (+1), S2=AVC/AIT/MTEV antérieur (+2), V=maladie vasculaire (IDM, AOMI, plaque aortique) (+1), A=âge 65-74ans (+1), Sc=sexe féminin (+1); SCORE ≥2 (hommes) ou ≥3 (femmes): anticoagulation recommandée (DOAC préféré si pas de valve mécanique)"
  - "HAS-BLED — Risque hémorragique sous anticoagulation: H=HTA non contrôlée (>160 systolique) (+1), A=insuffisance rénale ou hépatique (+1 chacun), S=AVC antérieur (+1), B=hémorragie antérieure ou prédisposition (+1), L=INR labile (< 60% dans la cible) (+1), E=âge>65ans (+1), D=médicaments (antiplaquettaires, AINS) ou alcool (+1); SCORE ≥3 = haut risque (ne contre-indique PAS l'anticoagulation mais justifie surveillance renforcée)"
  - "Score de GRACE — Risque à 6 mois dans le SCA: variables: âge, FC, PAS, créatinine, classe Killip, arrêt cardiaque, déviation ST, enzymes cardiaques positives; calculateur en ligne (www.gracescore.org); SCORE < 109 = bas risque, 109-140 = modéré, > 140 = élevé; guide la stratégie de revascularisation (urgente vs semi-urgente vs conservateur)"
  - "Score de TIMI UA/NSTEMI — Risque court terme: 7 critères (1 point chacun): âge ≥ 65 ans, ≥ 3 FRCV, sténose coronarienne connue ≥ 50%, déviation ST ≥ 0,5 mm, ≥ 2 épisodes angineux en 24h, utilisation aspirine dans les 7 jours, troponine élevée; SCORE 0-2 = bas, 3-4 = intermédiaire, 5-7 = élevé (mortalité + IDM + revascularisation urgente)"
  - "Classification de Killip — Gravité IC dans le SCA: I = pas de signe d'IC, II = râles crépitants < 50% des champs + B3 ± turgescence jugulaire, III = OAP (râles > 50% des champs), IV = choc cardiogénique (PA < 90 + oligurie + hypoperfusion périphérique); mortalité hospitalière: I=6%, II=17%, III=38%, IV=67%"


# source: lines 462-468 + clinical pivots
pieges:
  - "Confondre {s:dysurie vraie} (difficulté à uriner / vidange) et {s:brûlures mictionnelles} (signes irritatifs) — terminologie source d'erreurs DD"
  - "Oublier le {t:toucher rectal} chez tout homme avec dysurie: manque {p:prostatite}, {p:HBP}, {p:cancer prostate} et tonus sphinctérien (vessie neurologique)"
  - "Ne pas mesurer le {t:résidu post-mictionnel} à l'échographie → sous-estimer rétention chronique avec {p:IRA obstructive} silencieuse (créatinine élevée sans symptôme aigu)"
  - "Méconnaître un {p:syndrome de queue de cheval} (dysurie + anesthésie en selle + déficit MI) — perte de chance majeure si IRM différée"
  - "Traiter une dysurie masculine sans {t:ECBU} ni bilan: chez l'homme, toute infection urinaire est considérée comme compliquée (durée ATB et exploration différentes)"


# source: line 326-343 + clinical pivots
pieges:
  - "Prescrire antipsychotique SANS bilan organique au 1er épisode → manquer encéphalite anti-NMDA, tumeur, intoxication"
  - "Méconnaître {p:SMN} (fièvre + rigidité + AEG sous antipsychotique) — mortalité 10% sans arrêt immédiat"
  - "Négliger comorbidité cardio-métabolique (prise de poids 5-15 kg sous olanzapine, diabète, dyslipidémie) — surveiller poids/glycémie/lipides q3-6 mois"
  - "Arrêt brutal d'antipsychotique → effet rebond, rechute psychotique, syndrome de sevrage dopaminergique (sevrage progressif sur semaines/mois)"
  - "Ne pas hospitaliser malgré dangerosité par peur de la contrainte — la PAFA/PLAFA est un outil de soins, pas une punition"


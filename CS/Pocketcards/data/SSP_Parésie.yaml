# source: line 11-197
anamnese:
  socrates:
    - |-
      Onset — MODE D'INSTALLATION (pivot diagnostique):
      • {s:brutal} (secondes/minutes) → {p:AVC}, trauma
      • progressif (jours/semaines) → tumeur, compression, neuropathie
      • fluctuant (mieux le matin que le soir) → {p:myasthénie}
      • récurrent par poussées → {p:SEP}
    - |-
      Localisation et distribution:
      • hémiparésie (face + bras + jambe, même côté) → {p:AVC}
      • paraparésie (MI bilatérale) → atteinte médullaire
      • tétraparésie ascendante → {p:Guillain-Barré}
      • monomélique + douleur radiculaire → radiculopathie / plexopathie
    - "Character: faiblesse proximale (myopathie) ou distale (neuropathie)? prédominance motrice ou sensitive?"
    - "Radiation: douleur irradiant en trajet radiculaire? aggravée par toux/effort (hernie discale)?"
    - |-
      Time:
      • depuis quand exactement (heures, jours, semaines)?
      • évolution: aggravation, amélioration, stable, extension à d'autres territoires?
    - |-
      Exacerbating/Relieving:
      • fin de journée aggrave? repos soulage? ({p:myasthénie})
      • position penchée en avant soulage? ({s:claudication neurogène}, canal lombaire étroit)
      • effort aggrave puis améliore? ({p:Lambert-Eaton}, inverser la myasthénie)
    - "Severity: cotation MRC 0-5 subjective; impact fonctionnel (marche, préhension, ADL)?"
  specifique:
    - |-
      {s:Troubles sphinctériens} ⚠️ URGENCE:
      • rétention / incontinence urinaire?
      • incontinence fécale ou constipation récente?
      • {s:anesthésie en selle}? → {p:syndrome de la queue de cheval}
    - |-
      Signes AVC (FAST):
      • {s:asymétrie faciale}?
      • {s:trouble de la parole} (dysarthrie, aphasie)?
      • {s:trouble visuel} (hémianopsie, diplopie, amaurose)?
      • {s:céphalée intense et inhabituelle} → hémorragie?
    - "Fasciculations visibles? ({p:SLA}); diplopie + ptosis + fatigabilité? ({p:myasthénie})"
    - |-
      Épisode infectieux récent (2-4 semaines avant)?
      • infection respiratoire / digestive → {p:Guillain-Barré} [VÉRIFIER: délai post-infectieux exact]
    - "Modification de la marche: steppage (pied tombant, L4-L5), fauchage (pyramidal), ataxie?"
  atcd:
    - "Épisodes similaires ou AVC/AIT antérieurs? SEP connue (poussées-rémissions)?"
    - |-
      Facteurs de risque vasculaires (AVC):
      • HTA, diabète, fibrillation auriculaire, cardiopathie emboligène
      • tabac, dyslipidémie, obésité
    - "Cancer connu? (métastases vertébrales, compression médullaire, paranéoplasique)"
    - |-
      Médicaments neurotoxiques:
      • statines, corticoïdes (myopathie)
      • chimiothérapie (neuropathie périphérique)
      • {e:alcool chronique} (polyneuropathie, myélose funiculaire B12)
    - "Diabète (polyneuropathie sensitivo-motrice distale), insuffisance rénale, maladie auto-immune (lupus, Sjögren)?"
    - "Chirurgie rachidienne? chirurgie récente (position, compression peropératoire)?"

# source: line 389-432
red_flags:
  - description: "{s:Déficit focal nouveau à début brutal} (hémiparésie, aphasie, asymétrie faciale) ≤ 4.5 h"
    dx_suspecte: "{p:AVC ischémique}"
    action: "AVC pathway: appel 144, {t:CT cérébral} sans contraste STAT; {r:thrombolyse rt-PA IV} si < 4.5 h et critères remplis [VÉRIFIER: fenêtre thrombectomie ≤ 6 h ou 24 h selon imagerie]"
  - description: "{s:Céphalée en coup de tonnerre} + déficit neurologique focal + hémiparésie aiguë"
    dx_suspecte: "{p:Hémorragie cérébrale / HSA}"
    action: "{t:CT cérébral STAT}; neurochirurgie urgente; contre-indication absolue thrombolyse"
  - description: |-
      {s:Paraparésie bilatérale} + {s:anesthésie en selle} + {s:troubles sphinctériens}
      (rétention/incontinence)
    dx_suspecte: "{p:Syndrome de la queue de cheval}"
    action: "{t:IRM médullaire urgente}; chirurgie décompressive < 48 h [VÉRIFIER: délai optimal < 24 h selon guidelines]"
  - description: "{s:Parésie ascendante symétrique} + aréflexie + précédée infection 2-4 sem"
    dx_suspecte: "{p:Syndrome de Guillain-Barré}"
    action: "Hospitalisation; surveillance respiratoire {t:spirométrie} 4×/j; {r:Ig IV 0.4 g/kg/j × 5 j} ou plasmaphérèse"
  - description: "{s:Paraparésie / tétraparésie} progressive + niveau sensitif + troubles sphinctériens"
    dx_suspecte: "{p:Compression médullaire} (métastase, hernie discale massive, hématome épidural)"
    action: "{t:IRM médullaire STAT}; {r:dexaméthasone 10 mg IV bolus puis 4 mg × 4/j} si cause tumorale; décompression chirurgicale"
  - description: "{s:Fièvre} + rachialgie + déficit neurologique progressif"
    dx_suspecte: "{p:Spondylodiscite / abcès épidural}"
    action: "{t:IRM rachidienne STAT} + hémocultures; antibiothérapie IV empirique après prélèvements"
  - description: "{s:Cervicalgie / céphalée} + {s:Claude-Bernard-Horner} (ptosis-myosis) + déficit focal chez sujet jeune (± trauma cervical, manipulation)"
    dx_suspecte: "{p:Dissection artérielle cervicale} (carotide / vertébrale)"
    action: "{t:angio-IRM / angio-CT cervico-encéphalique} STAT; {r:antithrombotique} (antiagrégant ou anticoagulation selon protocole) ; avis neurovasculaire"

# source: line 200-384
examen:
  general:
    - "Signes vitaux: TA (2 bras), FC, T°, FR, SaO2 — AVANT tout autre geste"
    - "{t:Test de Cincinnati / FAST}: motricité faciale (sourire), épreuve bras tendus (10 sec), répétition phrase"
    - "Glycémie capillaire (hypoglycémie mimant AVC)"
    - "Inspection générale: amyotrophie, fasciculations, déformations rachidiennes, cicatrices"
  cible:
    - |-
      Force musculaire MRC 0-5 (SYSTÉMATIQUE bilatéral):
      • MS: épreuve des bras tendus (drift + pronation = pyramidal)
      • MS segmentaire: épaule C5, coude flexion C5-C6 / extension C7, poignet C6-C7, doigts C8
      • MI: épreuve de Mingazzini (cuisses 90°, jambes 90°, tenir 10 sec)
      • MI segmentaire: hanche L2-L3, genou L3-L4 / L5-S1, cheville dorsiflexion L4-L5 / plantaire S1
    - |-
      Réflexes ostéo-tendineux (comparer bilatéralement):
      • MS: bicipital C5-C6, stylo-radial C6, tricipital C7
      • MI: rotulien L3-L4, achilléen S1
      • {s:hyperréflexie + Babinski} = {e:syndrome pyramidal} central
      • {s:aréflexie} = atteinte périphérique (Guillain-Barré, radiculopathie)
    - |-
      Signes pyramidaux:
      • {t:Babinski} bilatéral (extension gros orteil = lésion voie corticospinale)
      • Hoffman, Trömner, clonus cheville/rotule
    - |-
      Sensibilité (si plainte sensitivo-motrice):
      • superficielle: tact léger, piqûre, thermique — comparer D/G, proximal/distal
      • profonde: sens de position (doigts, orteils), vibration diapason 128 Hz
      • {s:niveau sensitif} → compression médullaire; distribution en gants-chaussettes → polyneuropathie
    - |-
      Examen rachidien (si parésie MI ou suspicion atteinte médullaire):
      • douleur à la percussion des épineuses?
      • {t:Lasègue} (L5-S1), Lasègue inversé (L3-L4)
      • {t:toucher rectal} si troubles sphinctériens: tonus sphinctérien, réflexe anal
    - "Coordination: doigt-nez, talon-genou, marche talons / pointes / tandem; Romberg"
    - "Nerfs crâniens si atteinte centrale suspectée: VII (motricité faciale), oculomotricité, pupilles, langage"

# source: line 471-541
dd_top5:
  - dx: "{p:AVC ischémique}"
    indices: "Début brutal, déficit systématisé à un territoire vasculaire, facteurs risque vasculaires (HTA, FA, diabète); {t:CT}: hypodensité ou normale < 24 h; {t:IRM diffusion}: restriction précoce"
    freq: "fréquent, urgence absolue"
  - dx: "{p:Sclérose en plaques (SEP)}"
    indices: "Femme jeune (20-40 ans), poussées-rémissions, dissémination dans le temps et l'espace, antécédent névrite optique; {t:IRM}: lésions périventriculaires en T2; {t:PL}: bandes oligoclonales"
    freq: "fréquent dans cette tranche d'âge"
  - dx: "{p:Syndrome de Guillain-Barré}"
    indices: "Post-infectieux (2-4 sem), ascendant symétrique, aréflexie précoce, atteinte respiratoire possible; {t:PL}: dissociation albumino-cytologique; {t:EMG}: démyélinisation [VÉRIFIER: ordre indices confirmé avec EMG]"
    freq: "rare mais urgence (1-2/100 000/an)"
  - dx: "{p:Compression médullaire / queue de cheval}"
    indices: "Douleur radiculaire + niveau sensitif + troubles sphinctériens; cancer connu (métastases), hernie discale massive, hématome épidural; {t:IRM}: compression visible"
    freq: "urgence chirurgicale"
  - dx: "{p:Myasthénie / atteinte de la jonction neuromusculaire}"
    indices: "Fatigabilité fluctuante (aggravation en fin de journée), {s:ptosis} + {s:diplopie}, atteinte bulbaire (déglutition, phonation); {t:test au glaçon}, {t:Ac anti-RACh / anti-MuSK}, {t:EMG} décrément; crise myasthénique = urgence respiratoire"
    freq: "moins fréquent mais urgence si crise (atteinte respiratoire)"

# source: line 543-643
pec_initiale:
  immediate:
    - |-
      {p:AVC suspecté}: AVC pathway IMMÉDIAT
      • 144 / SMUR; {t:CT cérébral sans contraste} STAT
      • {r:rt-PA IV 0.9 mg/kg} (max 90 mg) si AVC ischémique < 4.5 h et critères remplis
      • thrombectomie si occlusion gros vaisseau ≤ 6 h (ou 24 h si pénombre viable)
      • {r:aspirine 300 mg} (PO/IV) à 24-48 h post-thrombolyse, ou d'emblée si pas de thrombolyse — prévention secondaire
      • unité neurovasculaire / stroke unit
    - |-
      {p:Queue de cheval} ou compression médullaire aiguë:
      • {t:IRM urgente} (< 6 h)
      • {r:dexaméthasone 10 mg IV bolus puis 4 mg × 4/j} si œdème péritumoral
      • chirurgie décompressive < 48 h (idéalement < 24 h)
    - |-
      {p:Guillain-Barré}:
      • hospitalisation en neurologie ± soins intensifs
      • {r:Ig IV 0.4 g/kg/j × 5 j} OU plasmaphérèse (4-6 échanges)
      • {t:spirométrie} 4×/j; intubation si CV < 20 mL/kg, PiMax < 30 ou PeMax < 40 cmH₂O (règle 20/30/40)
      • PAS de corticoïdes (inefficaces dans la forme aiguë)
    - "Mesures générales: prévenir TVP (HBPM si alitement), prévention escarres, mobilisation précoce, surveillance déglutition"
  orientation:
    - "Urgences STAT: tout déficit focal nouveau (AVC pathway), troubles sphinctériens aigus (queue de cheval), Guillain-Barré débutant"
    - "Hospitalisation neurologie: compression médullaire subaiguë, SEP en poussée, spondylodiscite"
    - "Consultation ambulatoire rapide (< 48 h): parésie stable modérée, polyneuropathie, suspicion myasthénie"
    - "Consignes retour urgences: aggravation brutale du déficit, apparition troubles respiratoires / déglutition / sphinctériens, troubles de conscience"

# source: line 433-468
examens_complementaires:
  - "{t:CT cérébral sans contraste}: déficit focal brutal (éliminer hémorragie avant thrombolyse)"
  - "{t:IRM cérébrale (+ diffusion)}: confirmation AVC ischémique, SEP (lésions T2), tumeur"
  - "{t:IRM médullaire urgente}: troubles sphinctériens, niveau sensitif, paraparésie progressive"
  - "{t:EMG + vitesses de conduction}: distinguer neuropathie (axonal/démyélinisant) vs myopathie vs jonction neuromusculaire"
  - "{t:Biologie STAT}: FSC, CRP, glycémie, iono, urée-créat, CPK (myopathie), B12/folates, TSH"
  - "{t:PL}: suspicion SEP (bandes oligoclonales), Guillain-Barré (dissociation albumino-cytologique)"

criteres_hospitalisation:
  - "Déficit focal brutal → AVC pathway (urgence absolue)"
  - "Troubles sphinctériens aigus ± paraparésie → queue de cheval ou compression médullaire"
  - "Parésie ascendante ± aréflexie → Guillain-Barré (surveillance respiratoire)"
  - "Fièvre + déficit neurologique progressif → spondylodiscite / abcès épidural"
  - "Aggravation rapide du déficit ou atteinte bulbaire (déglutition, phonation)"

pieges:
  - "Méconnaître un {p:syndrome de la queue de cheval}: ne JAMAIS omettre la question sur les troubles sphinctériens et le {t:TR} si positif — urgence chirurgicale < 48 h"
  - "Confondre parésie centrale ({s:hyperréflexie}, Babinski +) et périphérique ({s:aréflexie}, amyotrophie) — pivot topographique détermine le bilan"
  - "Banaliser une {p:myasthénie}: fatigabilité fluctuante + ptosis + diplopie → {t:test au glaçon} + {t:Ac anti-RACh / anti-MuSK} (le test à l'édrophonium/Tensilon n'est plus utilisé en Suisse — retiré du Compendium)"
  - "Attribuer une {p:SEP} à une parésie unique chez la femme jeune sans IRM — critères McDonald exigent dissémination temps ET espace"
  - "Oublier le bilan étiologique vasculaire dans un AVC ischémique: fibrillation auriculaire (ECG!), cardiopathie emboligène, sténose carotidienne"

